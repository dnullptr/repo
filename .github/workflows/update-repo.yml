name: Update APT Repo

on:
  push:
    branches: [ main ]
    paths:
      - 'debs/**'
      - 'Release'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install APT repo tools & generate Packages index
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd xz-utils bzip2 python3
          mkdir -p debs
          dpkg-scanpackages -m ./debs > Packages
          python3 - << 'EOF'
          with open("Packages", "r", encoding="utf-8") as f:
              raw = f.read().strip()
          stanzas = [s.strip() for s in raw.split("\n\n") if s.strip()]
          out = []
          for s in stanzas:
              if "Package: com.dnullptr.metalfg" in s and "SileoDepiction:" not in s:
                  s += "\nSileoDepiction: https://dnullptr.github.io/repo/depictions/metalfg.json"
                  if "Icon:" not in s:
                      s += "\nIcon: https://dnullptr.github.io/repo/CydiaIcon.png"
              elif "Package: com.dnullptr.depuke" in s and "SileoDepiction:" not in s:
                  s += "\nSileoDepiction: https://dnullptr.github.io/repo/depictions/depuke.json"
                  if "Icon:" not in s:
                      s += "\nIcon: https://dnullptr.github.io/repo/CydiaIcon.png"
              out.append(s)
          with open("Packages", "w", encoding="utf-8") as f:
              f.write("\n\n".join(out) + ("\n\n" if out else ""))
          EOF
          gzip -c9 Packages > Packages.gz
          xz -c9 Packages > Packages.xz
          zstd -c19 Packages > Packages.zst
          bzip2 -c9 Packages > Packages.bz2

      - name: Commit and push updated Packages index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.xz Packages.zst Packages.bz2
          git diff --staged --quiet || git commit -m "chore: auto-update APT Packages index"
          git push
